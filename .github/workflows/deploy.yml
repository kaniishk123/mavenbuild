name: run jar and store in code artifact

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  setup_and_load:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: configure aws oidc credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::995757496819:role/oidcrole
          aws-region: ap-south-1

      - name: build jar
        run: mvn -B clean package

      - name: get codeartifact token and configure maven
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain kanishk-domain \
            --query authorizationToken \
            --output text)

          mkdir -p ~/.m2

          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>codeartifact</id>
                <username>aws</username>
                <password>${TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: upload jar with revision versioning
        run: |
          REV=1.0.$GITHUB_RUN_NUMBER
          echo "Using version: $REV"

          mvn -B deploy \
            -Drevision=$REV \
            -DaltDeploymentRepository=codeartifact::default::https://kanishk-domain-995757496819.d.codeartifact.ap-south-1.amazonaws.com/maven/mavenbuild/

  run_on_ec2:
    runs-on: ubuntu-latest
    needs: setup_and_load
    steps:
      - name: config cred
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::995757496819:role/oidcrole
          aws-region: ap-south-1
      - name: fetch from artifact and run
        run: |
          aws ssm send-command \
            --instance-ids i-0ec5a746f57126beb \
            --document-name "AWS-RunShellScript" \
            --comment "Fetch latest jar from CodeArtifact & run" \
            --parameters commands='[
              "aws codeartifact login --tool maven --domain kanishk-domain --repository mavenbuild --region ap-south-1",
              "LATEST_VERSION=$(aws codeartifact list-package-versions --domain kanishk-domain --repository mavenbuild --format maven --namespace com.example --package my-java-app --query \"versions[0]\" --output text)",
              "mvn dependency:get -DgroupId=com.example -DartifactId=my-java-app -Dversion=$LATEST_VERSION",
              "LATEST_JAR=$(find ~/.m2/repository/com/example/my-java-app -name \"*.jar\" | sort | tail -1)",
              "echo Running $LATEST_JAR",
              "java -jar $LATEST_JAR"
            ]' \
            --output text
